name: QuantGuard gate
description: >
  Run the QuantGuard quantization accuracy regression gate, cache models and
  datasets, post a pull-request comment, and fail the job on a FAIL or ERROR.
inputs:
  config:
    description: Path to the QuantGuard YAML config, relative to the workspace.
    required: true
  extras:
    description: pip extras to install (for example "gpu,dev").
    default: gpu
  python-version:
    description: Python version for actions/setup-python. Ignored when setup-python is "false".
    default: "3.11"
  setup-python:
    description: Set to "false" on self-hosted runners that already provide the interpreter.
    default: "true"
  python-command:
    description: Python executable used to install and run QuantGuard.
    default: python
  constraints:
    description: >
      pip constraints file that pins library versions (create it with `pip freeze` from a
      known-good environment). Used when the file exists.
    default: constraints.txt
  hf-home:
    description: Hugging Face cache directory. Defaults to a folder under RUNNER_TEMP.
    default: ""
  post-comment:
    description: Post or update the pull-request comment ("true" or "false").
    default: "true"
  github-token:
    description: Token used for the comment. Needs pull-requests write permission.
    default: ${{ github.token }}
outputs:
  status:
    description: PASS, FAIL, ERROR or WARNING.
    value: ${{ steps.run.outputs.status }}
  report-dir:
    description: Directory holding report.json, report.md, report.html and pr_comment.md.
    value: ${{ steps.run.outputs.report_dir }}
  cache-hit:
    description: Whether the model and dataset cache was restored exactly.
    value: ${{ steps.cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      if: inputs.setup-python == 'true'
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Resolve cache directory
      id: dirs
      shell: bash
      run: |
        if [ -n "${{ inputs.hf-home }}" ]; then
          echo "hf_home=${{ inputs.hf-home }}" >> "$GITHUB_OUTPUT"
        else
          echo "hf_home=${RUNNER_TEMP}/hf-cache" >> "$GITHUB_OUTPUT"
        fi

    # Key on the config: changing a model, revision or task list refreshes the cache.
    - name: Cache models and datasets
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.dirs.outputs.hf_home }}
        key: hf-${{ runner.os }}-${{ hashFiles(inputs.config) }}
        restore-keys: |
          hf-${{ runner.os }}-

    - name: Install QuantGuard
      shell: bash
      env:
        PY: ${{ inputs.python-command }}
        CONSTRAINTS: ${{ inputs.constraints }}
      run: |
        "$PY" -m pip install --upgrade pip
        if [ -f "$CONSTRAINTS" ]; then
          "$PY" -m pip install -c "$CONSTRAINTS" -e ".[${{ inputs.extras }}]"
        else
          echo "::warning::No constraints file at $CONSTRAINTS; library versions are not pinned."
          "$PY" -m pip install -e ".[${{ inputs.extras }}]"
        fi

    - name: Run gate
      id: run
      shell: bash
      env:
        PY: ${{ inputs.python-command }}
        HF_HOME: ${{ steps.dirs.outputs.hf_home }}
        HF_HUB_DISABLE_TELEMETRY: "1"
        CONFIG: ${{ inputs.config }}
      run: |
        set +e
        started=$(date +%s)
        "$PY" -m quantguard.cli.main run --config "$CONFIG" --skip-performance --result-json quantguard-result.json
        code=$?
        elapsed=$(( $(date +%s) - started ))
        set -e
        status=$("$PY" -c "import json;print(json.load(open('quantguard-result.json'))['status'])" 2>/dev/null || echo ERROR)
        report_dir=$("$PY" -c "import json;print(json.load(open('quantguard-result.json'))['report_dir'])" 2>/dev/null || echo "")
        {
          echo "status=$status"
          echo "report_dir=$report_dir"
          echo "exit_code=$code"
        } >> "$GITHUB_OUTPUT"
        {
          echo "### QuantGuard: $status"
          echo "Runtime: ${elapsed}s. Model/dataset cache hit: ${{ steps.cache.outputs.cache-hit || 'false' }}."
        } >> "$GITHUB_STEP_SUMMARY"
        if [ -n "$report_dir" ] && [ -f "$report_dir/pr_comment.md" ]; then
          cat "$report_dir/pr_comment.md" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: quantguard-report-${{ github.run_id }}
        path: |
          reports/
          quantguard-result.json
        if-no-files-found: warn

    - name: Post pull-request comment
      if: always() && inputs.post-comment == 'true' && github.event_name == 'pull_request' && steps.run.outputs.report_dir != ''
      uses: actions/github-script@v7
      env:
        COMMENT_PATH: ${{ steps.run.outputs.report_dir }}/pr_comment.md
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const marker = '<!-- quantguard-report -->';
          let body;
          try { body = fs.readFileSync(process.env.COMMENT_PATH, 'utf8'); } catch (e) { return; }
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          try {
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
          } catch (e) {
            // Fork pull requests get a read-only token. The job summary still has the report.
            core.warning(`Could not post PR comment: ${e.message}`);
          }

    - name: Enforce gate
      shell: bash
      run: |
        code="${{ steps.run.outputs.exit_code }}"
        if [ -z "$code" ]; then code=2; fi
        exit "$code"
